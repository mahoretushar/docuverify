spring.application.name=docuverify
server.port=${PORT:8090}
spring.threads.virtual.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# PostgreSQL + pgvector
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/docuverify}
spring.datasource.username=${DB_USER:docuverify}
spring.datasource.password=${DB_PASSWORD:docuverify}
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

# Local models through Ollama: no API keys, documents never leave the machine
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.0
spring.ai.ollama.embedding.options.model=nomic-embed-text

docuverify.retrieval.top-k=5
docuverify.retrieval.similarity-threshold=0.55
docuverify.verification.support-threshold=0.65
docuverify.verification.min-groundedness=0.80
docuverify.verification.nli-enabled=true

management.endpoints.web.exposure.include=health,info,metrics
